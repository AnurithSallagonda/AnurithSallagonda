name: Update profile activity
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Render public activity cards
        run: python3 update_activity.py --refresh
      - name: Save refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.json activity-calendar.svg monthly-activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public activity cards"
          git push
